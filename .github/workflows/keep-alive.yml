name: Keep Supabase Alive

on:
  schedule:
    # Tiap 3 hari, jam 03:00 UTC (~10:00 WIB)
    - cron: '0 3 */3 * *'
  workflow_dispatch: {} # biar bisa trigger manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase odop_config_public
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://wwgqgsjyaodxfuhjwksj.supabase.co/rest/v1/odop_config_public?select=id" \
            -H "apikey: sb_publishable_wDYr46FfxvTH9IzGE-7w5Q_wkiYxXbu" \
            -H "Authorization: Bearer sb_publishable_wDYr46FfxvTH9IzGE-7w5Q_wkiYxXbu")
          echo "HTTP status: $response"
          if [ "$response" -ne 200 ]; then
            echo "::warning::Ping gagal, status $response — cek project Supabase manual"
          fi
